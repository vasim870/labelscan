name: Deploy LabelScan Website & Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Deploy Static Website & PWA to GitHub Pages
  deploy-website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Build Native Flutter Mobile App (Android APK)
  build-mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labelscan-android-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

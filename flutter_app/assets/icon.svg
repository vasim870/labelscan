<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#121C35"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="8"/>

  <!-- Subtle circuit grid lines -->
  <path d="M64 160h384M64 352h384M160 64v384M352 64v384" stroke="rgba(0, 240, 255, 0.08)" stroke-width="2"/>

  <!-- Center scanning reticle -->
  <path d="M140 100h-40a24 24 0 0 0-24 24v40" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <path d="M372 100h40a24 24 0 0 1 24 24v40" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <path d="M140 412h-40a24 24 0 0 1-24-24v-40" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <path d="M372 412h40a24 24 0 0 0 24-24v-40" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <!-- Legal Metrology Scales / Shield Emblem in Center -->
  <path d="M256 140v220" stroke="url(#lavenderGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M180 200h152" stroke="url(#lavenderGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="140" r="18" fill="url(#cyanGrad)"/>

  <!-- Left Scale Pan -->
  <path d="M180 200l-30 60h60z" fill="rgba(0, 240, 255, 0.2)" stroke="url(#cyanGrad)" stroke-width="8"/>
  <line x1="180" y1="200" x2="150" y2="260" stroke="url(#cyanGrad)" stroke-width="6"/>
  <line x1="180" y1="200" x2="210" y2="260" stroke="url(#cyanGrad)" stroke-width="6"/>

  <!-- Right Scale Pan -->
  <path d="M332 200l-30 60h60z" fill="rgba(196, 181, 253, 0.2)" stroke="url(#lavenderGrad)" stroke-width="8"/>
  <line x1="332" y1="200" x2="302" y2="260" stroke="url(#lavenderGrad)" stroke-width="6"/>
  <line x1="332" y1="200" x2="362" y2="260" stroke="url(#lavenderGrad)" stroke-width="6"/>

  <!-- Laser scan beam line -->
  <line x1="90" y1="256" x2="422" y2="256" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <!-- Base Stand -->
  <path d="M210 380h92" stroke="url(#lavenderGrad)" stroke-width="16" stroke-linecap="round"/>
</svg>
